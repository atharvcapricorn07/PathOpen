<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile</title>
  <link rel="stylesheet" href="../css/menu.css" />
</head>
<body>

  <div class="profile-container">

    <!-- Edit icon in top right -->
    <div class="edit-icon-wrapper">
      <div class="edit-icon" title="Edit Profile">
        <svg class="settings-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 0 24 24" width="20" fill="white">
          <path d="M0 0h24v24H0z" fill="none"/>
          <path d="M19.14 12.936c.036-.302.06-.61.06-.936s-.024-.634-.07-.936l2.03-1.582a.503.503 0 0 0 .12-.638l-1.92-3.317a.5.5 0 0 0-.605-.222l-2.39.96a7.048 7.048 0 0 0-1.622-.936l-.36-2.54A.494.494 0 0 0 14.76 2h-3.52a.494.494 0 0 0-.49.42l-.36 2.54a7.048 7.048 0 0 0-1.622.936l-2.39-.96a.5.5 0 0 0-.605.222l-1.92 3.317a.503.503 0 0 0 .12.638l2.03 1.582c-.045.31-.07.632-.07.936s.024.634.07.936l-2.03 1.582a.503.503 0 0 0-.12.638l1.92 3.317a.5.5 0 0 0 .605.222l2.39-.96c.492.393 1.033.72 1.622.936l.36 2.54a.494.494 0 0 0 .49.42h3.52a.494.494 0 0 0 .49-.42l.36-2.54c.59-.216 1.13-.543 1.622-.936l2.39.96a.5.5 0 0 0 .605-.222l1.92-3.317a.503.503 0 0 0-.12-.638l-2.03-1.582zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5S10.07 8.5 12 8.5s3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
        </svg>
        <span class="edit-text">Edit Profile</span>
      </div>
    </div>

    <!-- Profile header -->
    <div class="profile-header">
      <img src="../assets/profile-picture.png" alt="Profile Picture" class="profile-img">
      <div class="profile-info">
        <h2 class="profile-name">Atharv Kale</h2>
        <p class="profile-email">atharv.capricorn@gmail.com</p>
      </div>
    </div>

    <!-- Profile settings menu -->
    <div class="profile-menu">
      <div class="menu-item">Favourites</div>
      <div class="menu-item">Downloads</div>
      <div class="menu-item">Languages</div>
      <div class="menu-item">Location</div>
      <div class="menu-item">Subscription</div>
      <div class="menu-item">Display</div>
      <div class="menu-item">Clear Cache</div>
      <div class="menu-item">Clear History</div>
      <div class="menu-item">Log Out</div>
    </div>

    <!-- Home button -->
    <div style="text-align: center; margin-top: 30px;">
<button class="home-button" onclick="location.href='../index.html'">Back</button>
    </div>

  </div>

  <script src="../js/profile.js"></script>
</body>
</html>
