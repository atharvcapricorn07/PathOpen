<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings – PathAble</title>
  <link rel="stylesheet" href="../css/menu.css" />
</head>
<body class="settings-body">
  <main class="settings-container">
    <h1 class="settings-title">Settings</h1>
    <div class="settings-scrollable">

      <!-- Accessibility Settings -->
      <section class="settings-card">
        <h2>Accessibility</h2>
        <div class="setting-group">
          <label for="mobilityType">Mobility Type</label>
          <select id="mobilityType">
            <option value="wheelchair">Wheelchair</option>
            <option value="powerchair">Powerchair</option>
            <option value="cane">Cane</option>
            <option value="walker">Walker</option>
            <option value="injury">Temporary Injury</option>
            <option value="vision">Visual Impairment</option>
          </select>
        </div>

        <div class="setting-toggle">
          <label for="avoidStairs">Avoid Stairs</label>
          <input type="checkbox" id="avoidStairs" />
        </div>

        <div class="setting-toggle">
          <label for="avoidEscalators">Avoid Escalators</label>
          <input type="checkbox" id="avoidEscalators" />
        </div>

        <div class="setting-toggle">
          <label for="preferElevators">Prefer Elevators with Ramps</label>
          <input type="checkbox" id="preferElevators" />
        </div>
      </section>

      <!-- Map Settings -->
      <section class="settings-card">
        <h2>Map & Navigation</h2>
        <div class="setting-toggle">
          <label for="darkMode">Dark Mode</label>
          <input type="checkbox" id="darkMode" checked />
        </div>

        <div class="setting-toggle">
          <label for="voiceNav">Voice Instructions</label>
          <input type="checkbox" id="voiceNav" />
        </div>

        <div class="setting-toggle">
          <label for="vibrationAlerts">Vibration Feedback</label>
          <input type="checkbox" id="vibrationAlerts" />
        </div>

        <div class="setting-toggle">
          <label for="followMe">Follow Me Mode</label>
          <input type="checkbox" id="followMe" />
        </div>
      </section>

      <!-- Privacy Settings -->
      <section class="settings-card">
        <h2>Privacy</h2>
        <div class="setting-toggle">
          <label for="locationAccess">Allow Location Access</label>
          <input type="checkbox" id="locationAccess" checked />
        </div>

        <div class="setting-toggle">
          <label for="saveRoutes">Save Recent Routes</label>
          <input type="checkbox" id="saveRoutes" />
        </div>
      </section>

      <!-- Action Buttons -->
      <div class="settings-actions">
        <button id="saveBtn" class="save-button">Save</button>
        <button id="clearBtn" class="danger-button">Clear Data</button>
      </div>

      <!-- Back Button -->
<a href="/index.html" class="home-button no-underline">&larr; Back</a>
    </div>
  </main>
  <script src="../js/settings.js"></script>
</body>
</html>
