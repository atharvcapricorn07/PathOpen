<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADA Feature Detection</title>
  <link rel="stylesheet" href="../css/ai.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #markerList {
      margin-top: 16px;
    }
    .marker-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .marker-row select {
      flex: 1;
      padding: 6px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .marker-row button {
      padding: 6px 10px;
      background: #ff4d4d;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    #addMarkerBtn {
      margin-top: 8px;
      padding: 8px 14px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="home-button-wrapper">
    <button class="home-button" onclick="location.href='../index.html'">Back</button>
  </div>

  <div class="container">
    <h1>Upload an Image to Detect ADA Features</h1>

    <input type="file" id="imageInput" accept="image/*" />
    <img id="preview" style="display:none; max-width:100%; margin-top:10px;" />

    <div id="map" style="margin-top:16px;"></div>

    <div id="markerList"></div>
    <button id="addMarkerBtn" style="display:none;">+ Add Another Marker</button>

    <div id="status"></div>
    <button id="saveButton">Save and Return</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map;
    let markerRefs = [];
    let uploadedFile = null;

    const ADA_LABELS = [
      "a staircase",
      "a ramp",
      "a wheelchair",
      "an elevator",
      "no ADA feature",
      "a curb cut",
      "a handrail",
      "an accessible restroom",
      "a tactile path",
      "other"
    ];

    document.getElementById('imageInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      uploadedFile = file;

      const reader = new FileReader();
      reader.onload = e => {
        const preview = document.getElementById('preview');
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);

      const formData = new FormData();
      formData.append("image", file);

      setStatus('Analyzing image...');

      try {
        const res = await fetch("http://127.0.0.1:5000/analyze", {
          method: "POST",
          body: formData
        });
        const result = await res.json();
        setStatus('Done! Drag markers to the right spot, edit labels if needed, then save.');
        initMap(result);
      } catch (e) {
        setStatus('Error analyzing image. Is the server running?');
        console.error(e);
      }
    });

    function initMap(result) {
      if (!map) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const center = [pos.coords.latitude, pos.coords.longitude];
          map = L.map('map').setView(center, 17);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);
          placeMarkers(result, center);
        }, () => {
          const center = [47.6062, -122.3321];
          map = L.map('map').setView(center, 14);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);
          placeMarkers(result, center);
        });
      } else {
        const center = map.getCenter();
        placeMarkers(result, [center.lat, center.lng]);
      }
    }

    function placeMarkers(result, center) {
      markerRefs.forEach(m => { if (m) m.leafletMarker.remove(); });
      markerRefs = [];
      document.getElementById('markerList').innerHTML = '';

      let offset = 0.0002;
      Object.entries(result).forEach(([label]) => {
        const latlng = [center[0], center[1] + offset];
        offset += 0.0003;
        addMarker(label, latlng);
      });

      document.getElementById('addMarkerBtn').style.display = 'inline-block';
    }

    function addMarker(label, latlng) {
      const index = markerRefs.length;

      const row = document.createElement('div');
      row.className = 'marker-row';

      const select = document.createElement('select');
      ADA_LABELS.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l;
        opt.textContent = l;
        if (l === label) opt.selected = true;
        select.appendChild(opt);
      });

      if (!ADA_LABELS.includes(label)) {
        const opt = document.createElement('option');
        opt.value = label;
        opt.textContent = label;
        opt.selected = true;
        select.appendChild(opt);
      }

      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = '✕';
      deleteBtn.addEventListener('click', () => removeMarker(index));

      row.appendChild(select);
      row.appendChild(deleteBtn);
      document.getElementById('markerList').appendChild(row);

      const icon = L.divIcon({
        className: 'custom-marker-label',
        html: `<div class="marker-label">${label}</div>`,
        iconSize: [160, 40],
        iconAnchor: [80, 20]
      });

      const leafletMarker = L.marker(latlng, { icon, draggable: true }).addTo(map);

      select.addEventListener('change', () => {
        leafletMarker.setIcon(L.divIcon({
          className: 'custom-marker-label',
          html: `<div class="marker-label">${select.value}</div>`,
          iconSize: [160, 40],
          iconAnchor: [80, 20]
        }));
      });

      markerRefs.push({ leafletMarker, row, select });
    }

    function removeMarker(index) {
      if (markerRefs[index]) {
        markerRefs[index].leafletMarker.remove();
        markerRefs[index].row.remove();
        markerRefs[index] = null;
      }
    }

    document.getElementById('addMarkerBtn').addEventListener('click', () => {
      if (!map) return;
      const center = map.getCenter();
      addMarker('a ramp', [center.lat, center.lng]);
    });

    document.getElementById('saveButton').addEventListener('click', async () => {
      const active = markerRefs.filter(m => m !== null);
      if (active.length === 0) {
        alert('No markers to save. Please upload an image first.');
        return;
      }
      if (!uploadedFile) {
        alert('No image uploaded.');
        return;
      }

      setStatus('Saving...');

      try {
        for (const ref of active) {
          const latlng = ref.leafletMarker.getLatLng();
          const formData = new FormData();
          formData.append('lat', latlng.lat);
          formData.append('lng', latlng.lng);
          formData.append('label', ref.select.value);
          formData.append('image', uploadedFile);

          await fetch('http://127.0.0.1:5000/save-marker', {
            method: 'POST',
            body: formData
          });
        }

        setStatus('Saved!');
        setTimeout(() => { window.location.href = '../index.html'; }, 1000);
      } catch (e) {
        setStatus('Error saving. Try again.');
        console.error(e);
      }
    });

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }
  </script>
</body>
</html>
