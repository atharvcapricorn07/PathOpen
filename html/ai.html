<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PathOpen AI Accessibility Scanner</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="../css/ai.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    #dupModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(16,24,39,0.6);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #dupModal.open { display: flex; }
    #dupModalBox {
      background: var(--white);
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(16,24,39,0.3);
      text-align: center;
    }
    #dupModalBox h3 {
      margin: 0 0 6px; font-size: 1.05rem; font-weight: 700; color: var(--ink);
      text-transform: none; letter-spacing: normal;
    }
    #dupModalBox p  { margin: 0 0 16px; font-size: 0.9rem; color: var(--slate); line-height: 1.5; }
    #dupExistingImg {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
      display: none;
    }
    #dupExistingLabel {
      display: inline-block;
      background: var(--ochre-tint);
      color: var(--ochre);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .dup-btn-row { display: flex; gap: 10px; }
    .dup-btn-row button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-family: var(--font-ui);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    #dupYesBtn { background: var(--mist); color: var(--ink); }
    #dupYesBtn:hover { background: var(--line); }
    #dupNoBtn  { background: var(--signal); color: var(--white); }
    #dupNoBtn:hover  { background: var(--signal-dark); }
  </style>
</head>

<body>

  <div class="home-button-wrapper">
    <button class="home-button" onclick="location.href='../index.html'">
      <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13.5 4.5L7 11l6.5 6.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to map
    </button>
  </div>

  <div id="dupModal">
    <div id="dupModalBox">
      <h3>Possible duplicate</h3>
      <p id="dupModalDesc">A similar tag already exists nearby. Is this the same thing?</p>
      <img id="dupExistingImg" alt="Existing marker photo" />
      <div id="dupExistingLabel"></div>
      <div class="dup-btn-row">
        <button id="dupYesBtn">Yes, same thing — skip</button>
        <button id="dupNoBtn">No, save mine anyway</button>
      </div>
    </div>
  </div>

  <div class="container">
    <h1>ADA Accessibility Scanner</h1>
    <p class="subtitle">Upload a photo, review detected accessibility features, adjust marker locations, and save them to the map.</p>

    <div class="upload-zone">
      <input type="file" id="imageInput" accept="image/*" />
    </div>
    <img id="preview" alt="Uploaded Preview" style="display:none;" />
    <div id="map"></div>

    <h3>Detected Features</h3>
    <div id="markerList"></div>

    <button id="addMarkerBtn" style="display:none;">+ Add feature marker</button>
    <div id="status"></div>
    <button id="saveButton">Save and return</button>

    <div class="copyright">&copy; 2026 PathOpen. All rights reserved. &nbsp;·&nbsp; <a href="../privacy.html">Privacy</a> &nbsp;·&nbsp; <a href="../terms.html">Terms</a></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const HF = "https://atharvcapricorn07-pathopen.hf.space";

    let map;
    let markerRefs = [];
    let uploadedFile = null;

    const ADA_LABELS = [
      "a staircase", "a ramp", "a wheelchair", "an elevator",
      "no ADA feature", "a curb cut", "a handrail",
      "an accessible restroom", "a tactile path", "other"
    ];

    document.getElementById("imageInput").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      uploadedFile = file;

      const reader = new FileReader();
      reader.onload = (e) => {
        const preview = document.getElementById("preview");
        preview.src = e.target.result;
        preview.style.display = "block";
      };
      reader.readAsDataURL(file);

      const formData = new FormData();
      formData.append("image", file);
      setStatus("Analyzing image...");

      try {
        const res = await fetch(`${HF}/analyze`, { method: "POST", body: formData });
        const result = await res.json();

        const realFeatures = Object.entries(result).filter(([label]) => label !== "no ADA feature");
        const filtered = realFeatures.length > 0 ? Object.fromEntries(realFeatures) : result;

        if (Object.keys(filtered).length === 0) {
          setStatus("No accessibility features detected. You can add markers manually.");
        } else {
          setStatus("Analysis complete. Drag markers to adjust positions, then save.");
        }
        initMap(filtered);
      } catch (e) {
        console.error(e);
        setStatus("Error analyzing image. Please try again.", true);
      }
    });

    function initMap(result) {
      if (!map) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const center = [pos.coords.latitude, pos.coords.longitude];
            map = L.map("map").setView(center, 16);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
              subdomains: 'abcd', maxZoom: 19
            }).addTo(map);
            placeMarkers(result, center);
          },
          () => {
            const center = [47.6062, -122.3321];
            map = L.map("map").setView(center, 16);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
              subdomains: 'abcd', maxZoom: 19
            }).addTo(map);
            placeMarkers(result, center);
          }
        );
      } else {
        const center = map.getCenter();
        placeMarkers(result, [center.lat, center.lng]);
      }
    }

    function placeMarkers(result, center) {
      markerRefs.forEach((m) => { if (m) m.leafletMarker.remove(); });
      markerRefs = [];
      document.getElementById("markerList").innerHTML = "";
      let offset = 0.0002;
      Object.entries(result).forEach(([label]) => {
        const latlng = [center[0], center[1] + offset];
        offset += 0.0003;
        addMarker(label, latlng);
      });
      document.getElementById("addMarkerBtn").style.display = "inline-block";
    }

    function addMarker(label, latlng) {
      const index = markerRefs.length;
      const row = document.createElement("div");
      row.className = "marker-row";

      const select = document.createElement("select");
      ADA_LABELS.forEach((item) => {
        const option = document.createElement("option");
        option.value = item;
        option.textContent = item;
        if (item === label) option.selected = true;
        select.appendChild(option);
      });
      if (!ADA_LABELS.includes(label)) {
        const option = document.createElement("option");
        option.value = label;
        option.textContent = label;
        option.selected = true;
        select.appendChild(option);
      }

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "✕";
      deleteBtn.addEventListener("click", () => removeMarker(index));

      row.appendChild(select);
      row.appendChild(deleteBtn);
      document.getElementById("markerList").appendChild(row);

      const icon = L.divIcon({
        className: "custom-marker-label",
        html: `<div class="marker-label">${label}</div>`,
        iconSize: [160, 40],
        iconAnchor: [80, 20]
      });

      const leafletMarker = L.marker(latlng, { icon, draggable: true }).addTo(map);
      select.addEventListener("change", () => {
        leafletMarker.setIcon(L.divIcon({
          className: "custom-marker-label",
          html: `<div class="marker-label">${select.value}</div>`,
          iconSize: [160, 40],
          iconAnchor: [80, 20]
        }));
      });

      markerRefs.push({ leafletMarker, row, select });
    }

    function removeMarker(index) {
      if (!markerRefs[index]) return;
      markerRefs[index].leafletMarker.remove();
      markerRefs[index].row.remove();
      markerRefs[index] = null;
    }

    document.getElementById("addMarkerBtn").addEventListener("click", () => {
      if (!map) return;
      const center = map.getCenter();
      addMarker("a ramp", [center.lat, center.lng]);
    });

    // --- Duplicate modal ---
    let resolveDup = null;

    function showDupModal(existing) {
      const img  = document.getElementById('dupExistingImg');
      const lbl  = document.getElementById('dupExistingLabel');
      const desc = document.getElementById('dupModalDesc');

      if (existing.image_url) {
        img.src = existing.image_url;
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
      lbl.textContent  = existing.label || 'Unknown feature';
      desc.textContent = `A similar tag (${existing.distance_m}m away) already exists. Is this the same thing?`;
      document.getElementById('dupModal').classList.add('open');

      return new Promise(resolve => { resolveDup = resolve; });
    }

    function hideDupModal() {
      document.getElementById('dupModal').classList.remove('open');
    }

    document.getElementById('dupYesBtn').addEventListener('click', () => {
      hideDupModal();
      const resolve = resolveDup;
      resolveDup = null;
      if (resolve) resolve('skip');
    });

    document.getElementById('dupNoBtn').addEventListener('click', () => {
      hideDupModal();
      const resolve = resolveDup;
      resolveDup = null;
      if (resolve) resolve('save');
    });

    // --- Save ---
    document.getElementById("saveButton").addEventListener("click", async () => {
      const active = markerRefs.filter(m => m !== null);
      if (active.length === 0) { alert("No markers to save. Upload an image first."); return; }
      if (!uploadedFile)       { alert("Please upload an image."); return; }

      setStatus("Saving markers...");
      let savedCount = 0, skippedCount = 0, errorCount = 0;

      for (const ref of active) {
        const latlng = ref.leafletMarker.getLatLng();

        const buildForm = (force) => {
          const fd = new FormData();
          fd.append("lat",   latlng.lat);
          fd.append("lng",   latlng.lng);
          fd.append("label", ref.select.value);
          fd.append("image", uploadedFile);
          if (force) fd.append("force", "1");
          return fd;
        };

        try {
          const res = await fetch(`${HF}/save-marker`, { method: "POST", body: buildForm(false) });

          if (res.status === 409) {
            const data = await res.json();
            const existing = data.existing || { label: ref.select.value, distance_m: '?', image_url: null };
            const choice = await showDupModal(existing);

            if (choice === 'skip') {
              skippedCount++;
            } else {
              const res2 = await fetch(`${HF}/save-marker`, { method: "POST", body: buildForm(true) });
              if (res2.ok) savedCount++;
              else { errorCount++; console.error('Force save failed:', res2.status); }
            }
          } else if (!res.ok) {
            errorCount++;
            console.error(`Save failed for "${ref.select.value}":`, res.status);
          } else {
            savedCount++;
          }
        } catch (e) {
          errorCount++;
          console.error(e);
        }
      }

      const parts = [];
      if (savedCount   > 0) parts.push(`${savedCount} marker${savedCount > 1 ? 's' : ''} saved`);
      if (skippedCount > 0) parts.push(`${skippedCount} duplicate${skippedCount > 1 ? 's' : ''} skipped`);
      if (errorCount   > 0) parts.push(`${errorCount} failed`);

      if (errorCount > 0 && savedCount === 0 && skippedCount === 0) {
        setStatus("Error saving markers. Please try again.", true);
      } else {
        setStatus(parts.join(', ') + '.');
        setTimeout(() => { window.location.href = "../index.html"; }, 1500);
      }
    });

    function setStatus(msg, isError) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.classList.toggle("status-error", !!isError);
    }
  </script>

</body>
</html>
