<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PathAble</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F3F5F7">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>

  <div id="navbar">
    <div class="input-group">
      <input id="startSearch" type="text" placeholder="Start" autocomplete="off" />
      <button id="useLocationBtn" title="Use my location">
        <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 2c-3.3 0-6 2.7-6 6 0 4.5 6 11 6 11s6-6.5 6-11c0-3.3-2.7-6-6-6z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
          <circle cx="11" cy="8" r="2.2" stroke="currentColor" stroke-width="1.75"/>
        </svg>
      </button>
    </div>
    <input id="endSearch" type="text" placeholder="End" autocomplete="off" />
  </div>

  <div id="suggestions"></div>
  <div id="map"></div>

  <div class="zoom-controls">
    <button id="zoomInBtn" class="zoom-btn" aria-label="Zoom in">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="zoom-divider"></div>
    <button id="zoomOutBtn" class="zoom-btn" aria-label="Zoom out">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <button id="routeBtn">Get Directions</button>
  <button id="cancelRouteBtn" style="display:none;">Cancel Route</button>

  <!-- Unified action rail: same size, same shape, one component -->
  <div class="action-rail">
    <button id="fab" class="rail-btn">
      <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 7.5c0-.83.67-1.5 1.5-1.5h2l1-1.5h7l1 1.5h2c.83 0 1.5.67 1.5 1.5v9c0 .83-.67 1.5-1.5 1.5h-13C3.67 18 3 17.33 3 16.5v-9z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="11" cy="11.4" r="3.1" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      Report Feature
    </button>
    <button id="bugReportBtn" class="rail-btn is-ochre">
      <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 2.5v17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M5 3.5h9l-2 3.5 2 3.5H5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      Report Bug
    </button>
    <a href="how-to-use.html" class="rail-link">
      <button id="helpBtn" class="rail-btn">
        <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="8.25" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8.5 8.6c.25-1.4 1.5-2.25 2.85-2.05 1.35.2 2.3 1.25 2.1 2.55-.15.95-.85 1.4-1.5 1.85-.55.4-1.05.75-1.15 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="11" cy="15" r="0.95" fill="currentColor" stroke="none"/>
        </svg>
        Help
      </button>
    </a>
  </div>

  <!-- Location prompt banner (shown on page load instead of auto-requesting) -->
  <div id="locationBanner">
    <span>Enable location for better routing</span>
    <button id="locationBannerBtn">Allow</button>
    <button id="locationBannerDismiss">&#10005;</button>
  </div>

  <!-- Bug report modal -->
  <div id="bugReportOverlay">
    <div class="bug-modal">
      <div class="bug-modal-icon">
        <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 2.5v17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M5 3.5h9l-2 3.5 2 3.5H5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <h3>Report a bug</h3>
      <p>Tell us what went wrong. Be as specific as you can.</p>
      <textarea id="bugReportText" rows="5" placeholder="Example: The route button didn't respond when I tapped it near Green Lake"></textarea>
      <div class="bug-modal-actions">
        <button id="bugReportCancel">Cancel</button>
        <button id="bugReportSubmit">Submit</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <div class="copyright">&copy; 2026 PathAble. All rights reserved. &nbsp;·&nbsp; <a href="privacy.html">Privacy</a> &nbsp;·&nbsp; <a href="terms.html">Terms</a></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
