<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PathAble</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f8f83">
</head>
<body>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>

  <div id="navbar">
    <div class="input-group">
      <input id="startSearch" type="text" placeholder="Start" autocomplete="off" />
      <button id="useLocationBtn" title="Use my location">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="12" cy="9" r="2.4" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </button>
    </div>
    <input id="endSearch" type="text" placeholder="End" autocomplete="off" />
  </div>

  <div id="suggestions"></div>
  <div id="map"></div>

  <button id="routeBtn">Get Directions</button>
  <button id="cancelRouteBtn" style="display:none;">Cancel Route</button>

  <button id="fab">Report Feature</button>
  <button id="bugReportBtn">Report Bug</button>

  <a href="how-to-use.html">
    <button id="helpBtn">Help</button>
  </a>

  <!-- Location prompt banner (shown on page load instead of auto-requesting) -->
  <div id="locationBanner">
    <span>Enable location for better routing</span>
    <button id="locationBannerBtn">Allow</button>
    <button id="locationBannerDismiss">&#10005;</button>
  </div>

  <!-- Bug report modal -->
  <div id="bugReportOverlay">
    <div class="bug-modal">
      <h3>Report a Bug</h3>
      <p>Tell us what went wrong. Be as specific as you can.</p>
      <textarea id="bugReportText" rows="5" placeholder="Example: The route button didn't respond when I tapped it near Green Lake"></textarea>
      <div class="bug-modal-actions">
        <button id="bugReportCancel">Cancel</button>
        <button id="bugReportSubmit">Submit</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
