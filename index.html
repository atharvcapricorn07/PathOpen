<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PathAble</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f8f83">
</head>
<body>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>

  <div id="navbar">
    <div class="input-group">
      <input id="startSearch" type="text" placeholder="Start" autocomplete="off" />
      <button id="useLocationBtn" title="Use my location">📍</button>
    </div>
    <input id="endSearch" type="text" placeholder="End" autocomplete="off" />
  </div>

  <div id="suggestions"></div>
  <div id="map"></div>

  <button id="routeBtn">Get Directions</button>
  <button id="cancelRouteBtn" style="display:none;">Cancel Route</button>

  <button id="fab">📷 Report Feature</button>
  <button id="bugReportBtn">🐛 Report Bug</button>

  <a href="how-to-use.html">
    <button id="helpBtn">❓ How To Use</button>
  </a>

  <!-- Location prompt banner (shown on page load instead of auto-requesting) -->
  <div id="locationBanner">
    <span>📍 Enable location for better routing</span>
    <button id="locationBannerBtn">Allow</button>
    <button id="locationBannerDismiss">✕</button>
  </div>

  <!-- Bug report modal -->
  <div id="bugReportOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:12px; padding:20px; width:85%; max-width:360px; box-shadow:0 4px 20px rgba(0,0,0,0.2);">
      <h3 style="margin:0 0 10px 0; font-size:18px;">Report a Bug</h3>
      <p style="margin:0 0 10px 0; font-size:13px; color:#555;">Tell us what went wrong. Be as specific as you can.</p>
      <textarea id="bugReportText" rows="5" placeholder="e.g. The route button didn't respond when I tapped it near Green Lake" style="width:100%; box-sizing:border-box; border:1px solid #ccc; border-radius:8px; padding:8px; font-family:inherit; font-size:14px; resize:vertical;"></textarea>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
        <button id="bugReportCancel" style="background:#eee; border:none; border-radius:8px; padding:8px 14px; font-size:14px;">Cancel</button>
        <button id="bugReportSubmit" style="background:#0f8f83; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:14px;">Submit</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
